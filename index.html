<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Saitenwerk Bern – Startseite</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <header>
    <h1>Saitenwerk Bern</h1>
    <img src="bilder/logo.png" alt="Saitenwerk Bern Logo" class="logo">
    
    <!-- 3D Carousel Navigation -->
    <div class="carousel-container">
      <button class="carousel-btn prev" id="prevBtn">&#10094;</button>
      <div class="carousel-track-container">
        <div class="carousel-track">
          <div class="carousel-card active"><a href="index.html">Startseite</a></div>
          <div class="carousel-card"><a href="service.html">Service</a></div>
          <div class="carousel-card"><a href="kontakt.html">Kontakt</a></div>
        </div>
      </div>
      <button class="carousel-btn next" id="nextBtn">&#10095;</button>
    </div>
  </header>

  <main>
    <section class="hero-section scroll-animate">
      <img src="bilder/hero.jpg" alt="Gitarre Nahaufnahme" class="hero-img">
      <div class="hero-text">
        <h2>Willkommen bei Saitenwerk Bern</h2>
        <p>Wir reparieren und pflegen deine Gitarre in Bern. Komme einfach vorbei!</p>
      </div>
    </section>

    <section class="scroll-animate">
      <div class="highlight-box">
        <p><strong>Aktion:</strong> Kostenloser Saiten-Check bei jedem Werkstattbesuch!</p>
      </div>
    </section>

    <section class="scroll-animate">
      <h2>Unsere Werkstatt</h2>
      <img src="bilder/werkstatt.jpg" alt="Foto der Werkstatt" class="content-img">
    </section>
  </main>

  <footer>
    <p>Übungsprojekt der IMS gibb, 2026</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
